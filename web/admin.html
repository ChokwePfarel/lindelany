<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linde - Verification Dashboard</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Signika:wght@700&family=Poppins:wght@400;600;700;800&display=swap"
            rel="stylesheet"
    />

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: "Poppins", sans-serif;
          background: linear-gradient(135deg, #0d47a1 0%, #08306b 100%);
          min-height: 100vh;
          padding: 20px;
        }

        /* Logo Styling */
        .logo {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: 32px;
          font-weight: 800;
          color: white;
          margin-bottom: 20px;
        }

        .circle {
          width: 38px;
          height: 38px;
          border-radius: 50%;
          background: white;
          color: #0d47a1;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Signika", sans-serif;
          font-weight: bold;
          font-size: 24px;
        }

        .text {
          font-family: "Poppins", sans-serif;
          font-weight: 800;
        }

        /* Login Screen */
        .login-container {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        .login-box {
          background: white;
          padding: 50px 40px;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
          width: 100%;
          max-width: 450px;
        }

        .login-box .logo {
          justify-content: center;
          margin-bottom: 30px;
        }

        .login-box .circle {
          background: #0d47a1;
          color: white;
        }

        .login-box .text {
          color: #0d47a1;
        }

        .login-box h1 {
          color: #333;
          margin-bottom: 10px;
          font-size: 28px;
          text-align: center;
        }

        .login-box p {
          color: #666;
          margin-bottom: 30px;
          text-align: center;
        }

        .input-group {
          margin-bottom: 20px;
        }

        .input-group label {
          display: block;
          color: #333;
          margin-bottom: 8px;
          font-weight: 600;
          font-size: 14px;
        }

        .input-group input {
          width: 100%;
          padding: 14px 16px;
          border: 2px solid #e0e0e0;
          border-radius: 8px;
          font-size: 16px;
          font-family: "Poppins", sans-serif;
          transition: border-color 0.3s;
        }

        .input-group input:focus {
          outline: none;
          border-color: #0d47a1;
        }

        .btn {
          width: 100%;
          padding: 14px;
          border: none;
          border-radius: 8px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s;
          font-family: "Poppins", sans-serif;
        }

        .btn-primary {
          background: #0d47a1;
          color: white;
        }

        .btn-primary:hover {
          background: #08306b;
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(13, 71, 161, 0.4);
        }

        .btn-primary:disabled {
          opacity: 0.6;
          cursor: not-allowed;
          transform: none;
        }

        /* Dashboard */
        .dashboard {
          display: none;
        }

        .container {
          max-width: 1400px;
          margin: 0 auto;
        }

        .header {
          background: white;
          padding: 25px 30px;
          border-radius: 16px;
          margin-bottom: 30px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .header .logo {
          margin: 0;
        }

        .header .circle {
          background: #0d47a1;
          color: white;
        }

        .header .text {
          color: #0d47a1;
        }

        .header-right {
          display: flex;
          align-items: center;
          gap: 20px;
        }

        .user-info {
          color: #666;
          font-size: 14px;
          font-weight: 500;
        }

        .btn-logout {
          padding: 10px 20px;
          background: #d32f2f;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          transition: all 0.3s;
        }

        .btn-logout:hover {
          background: #c62828;
          transform: translateY(-2px);
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 20px;
          margin-bottom: 30px;
        }

        .stat-card {
          background: white;
          padding: 25px;
          border-radius: 16px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
          color: #666;
          font-size: 14px;
          margin-bottom: 10px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          font-weight: 600;
        }

        .stat-card .number {
          color: #0d47a1;
          font-size: 36px;
          font-weight: 800;
        }

        /* Pagination Controls */
        .pagination-controls {
          display: none;
          justify-content: center;
          align-items: center;
          gap: 20px;
          background: white;
          padding: 20px;
          border-radius: 16px;
          margin-bottom: 30px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .pagination-controls button {
          padding: 10px 20px;
          background: #667eea;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          transition: all 0.3s;
        }

        .pagination-controls button:hover:not(:disabled) {
          background: #5568d3;
          transform: translateY(-2px);
        }

        .pagination-controls button:disabled {
          background: #ccc;
          cursor: not-allowed;
          transform: none;
        }

        .page-info {
          color: #333;
          font-weight: 500;
        }

        .verification-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
          gap: 25px;
        }

        .verification-card {
          background: white;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s, box-shadow 0.3s;
        }

        .verification-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .card-image {
          width: 100%;
          height: 250px;
          object-fit: cover;
          background: #f5f5f5;
          cursor: pointer;
          transition: opacity 0.3s;
        }

        .card-image:hover {
          opacity: 0.9;
        }

        .card-content {
          padding: 25px;
        }

        .card-title {
          color: #0d47a1;
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 15px;
        }

        .card-info {
          color: #666;
          margin-bottom: 8px;
          font-size: 14px;
          line-height: 1.6;
        }

        .card-info strong {
          color: #333;
          margin-right: 8px;
          font-weight: 600;
        }

        .card-actions {
          display: flex;
          gap: 12px;
          margin-top: 20px;
        }

        .btn-approve {
          flex: 1;
          padding: 12px;
          background: #4caf50;
          color: white;
          border: none;
          border-radius: 8px;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          cursor: pointer;
          transition: all 0.3s;
        }

        .btn-approve:hover {
          background: #45a049;
          transform: translateY(-2px);
        }

        .btn-reject {
          flex: 1;
          padding: 12px;
          background: #d32f2f;
          color: white;
          border: none;
          border-radius: 8px;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          cursor: pointer;
          transition: all 0.3s;
        }

        .btn-reject:hover {
          background: #c62828;
          transform: translateY(-2px);
        }

        .btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
          transform: none !important;
        }

        /* Modal */
        .modal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.7);
          z-index: 1000;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }

        .modal.active {
          display: flex;
        }

        .modal-content {
          background: white;
          padding: 35px;
          border-radius: 16px;
          max-width: 500px;
          width: 100%;
          max-height: 90vh;
          overflow-y: auto;
        }

        .modal-content h2 {
          color: #0d47a1;
          margin-bottom: 20px;
          font-weight: 700;
        }

        .modal-content textarea {
          width: 100%;
          padding: 14px;
          border: 2px solid #e0e0e0;
          border-radius: 8px;
          font-size: 14px;
          font-family: "Poppins", sans-serif;
          resize: vertical;
          min-height: 120px;
          margin-bottom: 20px;
        }

        .modal-content textarea:focus {
          outline: none;
          border-color: #0d47a1;
        }

        .modal-actions {
          display: flex;
          gap: 12px;
        }

        .btn-cancel {
          flex: 1;
          padding: 12px;
          background: #95a5a6;
          color: white;
          border: none;
          border-radius: 8px;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          cursor: pointer;
          transition: all 0.3s;
        }

        .btn-cancel:hover {
          background: #7f8c8d;
        }

        .btn-send {
          flex: 1;
          padding: 12px;
          background: #d32f2f;
          color: white;
          border: none;
          border-radius: 8px;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          cursor: pointer;
          transition: all 0.3s;
        }

        .btn-send:hover {
          background: #c62828;
        }

        .empty-state {
          background: white;
          padding: 60px;
          border-radius: 16px;
          text-align: center;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .empty-state h2 {
          color: #0d47a1;
          margin-bottom: 10px;
          font-weight: 700;
        }

        .empty-state p {
          color: #666;
        }

        .loading {
          text-align: center;
          padding: 40px;
          color: white;
          font-size: 18px;
          font-weight: 600;
        }

        .error-message {
          background: #fff3cd;
          color: #856404;
          padding: 12px 16px;
          border-radius: 8px;
          margin-bottom: 20px;
          border: 1px solid #ffeaa7;
        }

        .image-modal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.9);
          z-index: 2000;
          justify-content: center;
          align-items: center;
          padding: 20px;
          cursor: pointer;
        }

        .image-modal.active {
          display: flex;
        }

        .image-modal img {
          max-width: 90%;
          max-height: 90%;
          object-fit: contain;
          border-radius: 8px;
        }

        .image-modal-close {
          position: absolute;
          top: 20px;
          right: 20px;
          background: white;
          color: #333;
          border: none;
          padding: 12px 24px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          font-family: "Poppins", sans-serif;
          transition: all 0.3s;
        }

        .image-modal-close:hover {
          background: #f5f5f5;
        }

        @media (max-width: 768px) {
          .header {
            flex-direction: column;
            gap: 20px;
            text-align: center;
          }

          .header-right {
            flex-direction: column;
            width: 100%;
          }

          .btn-logout {
            width: 100%;
          }

          .verification-grid {
            grid-template-columns: 1fr;
          }
        }
    </style>
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" class="login-container">
    <div class="login-box">
        <div class="logo">
            <div class="circle">L</div>
            <span class="text">inde</span>
        </div>
        <h1>Admin Login</h1>
        <p>Accommodation Verification Dashboard</p>
        <div id="loginError"></div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                        placeholder="Enter your email"
                />
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                />
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                Sign In
            </button>
        </form>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboardScreen" class="dashboard">
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="circle">L</div>
                <span class="text">inde</span>
            </div>
            <div class="header-right">
                <span class="user-info" id="userEmail"></span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Pending Verifications</h3>
                <div class="number" id="pendingCount">0</div>
            </div>
        </div>

        <!-- Pagination Controls -->
        <div id="paginationControls" class="pagination-controls"></div>

        <div id="loadingState" class="loading">Loading verifications...</div>

        <div id="emptyState" class="empty-state" style="display: none">
            <h2>All Clear!</h2>
            <p>No pending verifications at the moment.</p>
        </div>

        <div id="verificationGrid" class="verification-grid"></div>
    </div>
</div>

<!-- Reject Modal -->
<div id="rejectModal" class="modal">
    <div class="modal-content">
        <h2>Reject Verification</h2>
        <textarea
                id="rejectReason"
                placeholder="Enter the reason for rejection..."
        ></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelReject">Cancel</button>
            <button class="btn-send" id="sendReject">Send Rejection</button>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="image-modal">
    <button class="image-modal-close" id="closeImageModal">Close</button>
    <img id="modalImage" src="" alt="Proof image" />
</div>

<script type="module" src="./js/adminLogIn.js"></script>
</body>
</html>
